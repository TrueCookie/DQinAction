name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt
        name: Install deps

      - run: pytest --junitxml=results.xml
        name: Run tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results.xml
